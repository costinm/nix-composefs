[package]
name = "nix-composefs"
version = "0.1.0"
edition = "2021"
description = "Sync /nix/store as a signed composefs store: build, sign, transfer, materialize"
license = "MIT"

[dependencies]
# composefs-rs: metadata tree, EROFS writer, fs-verity, object store traits.
# For experimentation against the local clone, switch to:
#   composefs = { path = "../composefs-rs/crates/composefs" }
composefs = "0.9.2"
# The composefs crate links the openssl crate for its hashers. Build it
# vendored (from source, all inputs from Nix) so the resulting binary has no
# dynamic dependency on a system libssl and runs on any glibc.
openssl = { version = "0.10", default-features = false, features = ["vendored"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync"] }
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }
anyhow = { version = "1", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# Signing (initos-compatible conventions; pure Rust, no OpenSSL at runtime).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", default-features = false, features = ["std"] }
rsa = { version = "0.9.6", default-features = false, features = ["std", "pem", "sha2", "hazmat"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
hex = { version = "0.4", default-features = false, features = ["std"] }
# Same version as composefs uses; needed for IntoBytes on hash values.
zerocopy = { version = "0.8", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
